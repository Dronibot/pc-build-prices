name: Оновлення цін

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Оновити ціни
        run: node scripts/update.mjs

      - name: Закомітити зміни data/*.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          if git diff --cached --quiet; then
            echo 'Дані не змінилися — коміт не потрібен.'
            exit 0
          fi
          git pull --rebase --autostash
          git add data/*.json
          git commit -m "Оновлення цін: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push не вдався (спроба $i), підтягую зміни й пробую ще раз…"
            sleep 5
            git pull --rebase
          done
          exit 1
